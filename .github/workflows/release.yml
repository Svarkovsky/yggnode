name: Build & Release Multi-Arch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mips-unknown-linux-musl
            arch: mips-ath79-bigendian
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-mips-linux-musl.tar.xz
            toolchain_dir: mips-linux-musl
            cc: mips-linux-musl-gcc
            ar: mips-linux-musl-ar
            strip: mips-linux-musl-strip
            cflags: -Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie
            ldflags: -static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-mips-static

          - target: mipsel-unknown-linux-musl
            arch: mipsel-ramips-littleendian
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-mipsel-linux-musl.tar.xz
            toolchain_dir: mipsel-linux-musl
            cc: mipsel-linux-musl-gcc
            ar: mipsel-linux-musl-ar
            strip: mipsel-linux-musl-strip
            cflags: -Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie
            ldflags: -static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-mipsel-static

          - target: armv7-unknown-linux-musleabihf
            arch: armv7-cortexa7-hardfloat
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-armv7l-linux-musleabihf.tar.xz
            toolchain_dir: armv7l-linux-musleabihf
            cc: armv7l-linux-musleabihf-gcc
            ar: armv7l-linux-musleabihf-ar
            strip: armv7l-linux-musleabihf-strip
            cflags: -Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-arm-static

          - target: aarch64-unknown-linux-musl
            arch: arm64-aarch64
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-aarch64-linux-musl.tar.xz
            toolchain_dir: aarch64-linux-musl
            cc: aarch64-linux-musl-gcc
            ar: aarch64-linux-musl-ar
            strip: aarch64-linux-musl-strip
            cflags: -Os -march=armv8-a -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-aarch64-static

          - target: x86_64-unknown-linux-musl
            arch: x86_64-generic
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-x86_64-linux-musl.tar.xz
            toolchain_dir: x86_64-linux-musl
            cc: x86_64-linux-musl-gcc
            ar: x86_64-linux-musl-ar
            strip: x86_64-linux-musl-strip
            cflags: -Os -march=x86-64 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: ""

          - target: i686-unknown-linux-musl
            arch: i686-x86-32bit
            toolchain_url: https://github.com/userdocs/qbt-musl-cross-make/releases/latest/download/x86_64-i686-linux-musl.tar.xz
            toolchain_dir: i686-linux-musl
            cc: i686-linux-musl-gcc
            ar: i686-linux-musl-ar
            strip: i686-linux-musl-strip
            cflags: -Os -march=i686 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables
            ldflags: -static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL
            qemu: qemu-i386-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Register QEMU User Static Emulation
        if: matrix.qemu != ''
        run: |
          docker run --rm --privileged multiarch/qemu-user-static:register --reset 2>/dev/null || true
      - name: Install Rust Nightly Toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly

      - name: Cache Musl Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/${{ matrix.toolchain_dir }}
          key: toolchain-${{ matrix.toolchain_dir }}-v2

      - name: Download Musl Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          cd toolchains
          curl --retry 3 --retry-delay 5 -fSL "${{ matrix.toolchain_url }}" -o toolchain.tar.xz
          tar -xf toolchain.tar.xz
          rm -f toolchain.tar.xz

      - name: Build sstrip from ELFkickers
        run: |
          mkdir -p tools
          cd tools
          wget -q http://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz || true
          if [ -f ELFkickers-3.2.tar.gz ]; then
            tar -xf ELFkickers-3.2.tar.gz
            cd ELFkickers-3.2/elfrw && make libelfrw.a
            cd ../sstrip && gcc -O2 -I../elfrw sstrip.c ../elfrw/libelfrw.a -o ../../sstrip
            cd ../..
            rm -rf tools/ELFkickers-3.2 tools/ELFkickers-3.2.tar.gz
          fi

      - name: Build yggnode static binary
        run: |
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/toolchains/${{ matrix.toolchain_dir }}/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"

          # 1. Compatibility stub for -lunwind
          mkdir -p compat_lib
          "$TOOLCHAIN_BIN/${{ matrix.ar }}" cr compat_lib/libunwind.a

          # 2. Wrapper script to ensure 100% static linking
          cat << 'WRAPPER_EOF' > mips-linker.sh
          #!/bin/bash
          ARGS=()
          for arg in "$@"; do
              if [ "$arg" = "-Wl,-Bdynamic" ]; then
                  ARGS+=("-Wl,-Bstatic")
              else
                  ARGS+=("$arg")
              fi
          done
          exec ${{ matrix.cc }} -static -no-pie "${ARGS[@]}"
          WRAPPER_EOF
          chmod +x mips-linker.sh

          # 3. Configure .cargo/config.toml
          mkdir -p .cargo
          cat << TOML_EOF > .cargo/config.toml
          [target.${{ matrix.target }}]
          linker = "$GITHUB_WORKSPACE/mips-linker.sh"
          rustflags = [
              "-C", "target-feature=+crt-static",
              "-C", "force-unwind-tables=no",
              "--remap-path-prefix==",
              "-C", "link-self-contained=no",
              "-C", "link-arg=-L$GITHUB_WORKSPACE/compat_lib",
              "-C", "link-arg=-Wl,--gc-sections",
              "-C", "link-arg=-Wl,--start-group",
              "-C", "link-arg=-lc",
              "-C", "link-arg=-lgcc",
              "-C", "link-arg=-lpthread",
              "-C", "link-arg=-lrt",
              "-C", "link-arg=-Wl,--end-group",
              "-C", "link-arg=-Wl,--build-id=none",
              "-C", "link-arg=-Wl,-z,norelro",
              "-C", "link-arg=-Wl,-O2",
              "-C", "link-arg=-Wl,--exclude-libs,ALL",
          ]

          [unstable]
          build-std = ["std", "panic_abort"]
          build-std-features = ["optimize_for_size"]
          TOML_EOF

          TARGET_UNDERSCORE="${{ matrix.target }}"
          TARGET_UNDERSCORE="${TARGET_UNDERSCORE//-/_}"

          export CC_${TARGET_UNDERSCORE}="${{ matrix.cc }}"
          export AR_${TARGET_UNDERSCORE}="${{ matrix.ar }}"
          export CFLAGS_${TARGET_UNDERSCORE}="${{ matrix.cflags }}"
          export TARGET_CC="${{ matrix.cc }}"
          export TARGET_CFLAGS="${{ matrix.cflags }}"

          cargo +nightly build \
            --target ${{ matrix.target }} \
            --profile small \
            --no-default-features \
            --features tun,ctl \
            -p yggdrasil \
            -Zbuild-std=std,panic_abort \
            -Zbuild-std-features=optimize_for_size

          BIN="target/${{ matrix.target }}/small/yggdrasil"
          "$TOOLCHAIN_BIN/${{ matrix.strip }}" -s -R .comment -R .note -R .note.gnu.build-id -R .note.ABI-tag "$BIN"
          if [ -f tools/sstrip ]; then
            tools/sstrip "$BIN" || true
          fi
          ls -lh "$BIN"

      - name: Verify Binary Execution via QEMU
        run: |
          BIN="target/${{ matrix.target }}/small/yggdrasil"
          chmod +x "$BIN"
          if [ -n "${{ matrix.qemu }}" ] && command -v "${{ matrix.qemu }}" >/dev/null 2>&1; then
            ${{ matrix.qemu }} "$BIN" --version
          else
            "$BIN" --version || true
          fi

      - name: Package Distribution Archive
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.3.0}"
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/toolchains/${{ matrix.toolchain_dir }}/bin"
          CC_VER=$("${TOOLCHAIN_BIN}/${{ matrix.cc }}" --version | head -n 1)
          RUST_VER=$(rustc --version)
          chmod +x scripts/package_target.sh
          ./scripts/package_target.sh \
            "target/${{ matrix.target }}/small/yggdrasil" \
            "${{ matrix.arch }}" \
            "$VERSION" \
            Releases \
            "${{ matrix.cflags }}" \
            "${{ matrix.ldflags }}" \
            "${{ matrix.target }}" \
            "${{ matrix.cc }}" \
            "$CC_VER | $RUST_VER"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yggnode-${{ matrix.arch }}
          path: |
            Releases/*.zip
            Releases/*.zip.md5
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Consolidate Release Assets
        run: |
          mkdir -p release_assets
          find dist/ -type f \( -name "*.zip" -o -name "*.md5" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Generate Release Notes
        run: |
          cat << 'NOTES' > release_notes.md
          ## What's Changed in yggnode

          ### Multi-Architecture Builds
          Official standalone static release archives compiled against `musl libc` with pre-release QEMU execution verification for 6 hardware architectures:
          - **mips-ath79-bigendian** (`mips-unknown-linux-musl`): Qualcomm Atheros AR9xxx/QCA95xx (OpenWrt `ath79`, soft-float).
          - **mipsel-ramips-littleendian** (`mipsel-unknown-linux-musl`): MediaTek/Ralink MT7620/MT7621/MT7628 (OpenWrt/Padavan/Keenetic `ramips`, soft-float).
          - **armv7-cortexa7-hardfloat** (`armv7-unknown-linux-musleabihf`): Cortex-A7/A9, Raspberry Pi 2 / Zero 2W, Orange Pi (hard-float).
          - **arm64-aarch64** (`aarch64-unknown-linux-musl`): Cortex-A53/A72, Raspberry Pi 3/4/5, modern ARM routers and servers.
          - **x86_64-generic** (`x86_64-unknown-linux-musl`): 64-bit Intel / AMD servers, PC, and VPS.
          - **i686-x86-32bit** (`i686-unknown-linux-musl`): 32-bit x86 legacy hardware and thin clients.

          ### Architecture & Resource Optimizations
          - **Minimal RAM Footprint:** Runs with ~2.5 MB RSS under real network traffic.
          - **Pure Kernel L3 Interface:** Built strictly with `--no-default-features --features tun,ctl`.
          - **Removed Transports:** Stripped QUIC, WebSockets, CKR, and systemd to save RAM and binary size.
          - **32-bit MIPS Compatibility:** Replaced `AtomicU64` with `AtomicU32` in `crates/yggdrasil/src/ipv6rwc.rs`, fixing build and link failures on 32-bit architectures.
          - **100% Static Musl Binaries:** Completely independent of host firmware libraries (works on uClibc, musl, or old glibc).

          ### Compilation Flags & Toolchain Matrix
          | Architecture | Target Triple | CFLAGS | LDFLAGS | C&nbsp;Library | Linker |
          |:---|:---|:---|:---|:---:|:---:|
          | <sub>**MIPS&nbsp;Big-Endian**</sub> | <sub>`mips-unknown-linux-musl`</sub> | <sub>`-Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie`</sub> | <sub>`-static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | <sub>**MIPSEL&nbsp;Little-Endian**</sub> | <sub>`mipsel-unknown-linux-musl`</sub> | <sub>`-Os -march=24kc -mtune=24kc -mno-branch-likely -msoft-float -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -mno-shared -no-pie`</sub> | <sub>`-static -no-pie -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | <sub>**ARMv7-A&nbsp;32-bit**</sub> | <sub>`armv7-unknown-linux-musleabihf`</sub> | <sub>`-Os -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | <sub>**ARM64&nbsp;/&nbsp;AArch64**</sub> | <sub>`aarch64-unknown-linux-musl`</sub> | <sub>`-Os -march=armv8-a -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | <sub>**x86_64**</sub> | <sub>`x86_64-unknown-linux-musl`</sub> | <sub>`-Os -march=x86-64 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |
          | <sub>**i686&nbsp;32-bit**</sub> | <sub>`i686-unknown-linux-musl`</sub> | <sub>`-Os -march=i686 -fno-ident -fno-stack-protector -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables`</sub> | <sub>`-static -Wl,--gc-sections -lpthread -lrt -lgcc -Wl,--build-id=none -Wl,-z,norelro -Wl,-O2 -Wl,--exclude-libs,ALL`</sub> | musl&nbsp;1.2.5 | GNU&nbsp;ld |

          All targets compiled with Rust Nightly (`-Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size`).
          Each distribution ZIP contains `yggdrasil`, `yggdrasil.sample.toml`, `S25yggnode` init script, `build_info.txt`, and `md5sums.txt`.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: yggnode ${{ github.ref_name }}
          body_path: release_notes.md
          files: release_assets/*
