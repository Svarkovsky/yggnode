name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run workspace tests
        run: cargo test --all-targets --workspace

      - name: Static Analysis (Clippy slim embedded profile)
        run: cargo clippy --no-default-features --features tun,ctl -p yggdrasil

      # Keep the slim build (no ws/quic - e.g. OpenWrt) compiling.
      - name: Check slim build
        run: cargo check -p yggdrasil --no-default-features --features ctl,tun,systemd,ckr
